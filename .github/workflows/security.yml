name: Security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  UV_LOCKED: "1"

jobs:
  audit:
    name: Audit runtime, groups, and extras
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install the auditor
        run: uv sync --locked --no-default-groups --only-group audit
      - name: Audit runtime dependencies
        run: |
          uv export --locked --no-default-groups --no-emit-project --format requirements-txt --output-file runtime.txt
          uv run --no-sync pip-audit --strict --disable-pip --requirement runtime.txt
      - name: Audit all dependency groups and extras
        run: |
          uv export --locked --all-groups --all-extras --no-emit-project --format requirements-txt --output-file all.txt
          uv run --no-sync pip-audit --strict --disable-pip --requirement all.txt
