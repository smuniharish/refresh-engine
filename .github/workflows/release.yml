name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Synchronize environment
        run: uv sync --frozen
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME.TrimStart("v")
          $project = uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $package = uv run python -c "import refresh_engine; print(refresh_engine.__version__)"
          if ($tag -ne $project -or $tag -ne $package) {
            throw "Tag ($tag), project ($project), and package ($package) versions differ"
          }
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run pyrefly check
      - run: uv run pytest --cov
      - run: uv run mkdocs build --strict
      - run: uv build
      - run: uv publish --dry-run --trusted-publishing never dist/*
      - run: uv run python scripts/validate_distribution.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: astral-sh/setup-uv@v6
      - name: Publish with trusted identity
        run: uv publish --trusted-publishing always dist/*
