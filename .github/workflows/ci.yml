name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.12 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run pyrefly check
      - run: uv run pytest --cov=refresh_engine --cov-report=term-missing
      - run: uv run python scripts/check_docs_examples.py
      - run: uv run python scripts/run_examples.py
      - run: uv run mkdocs build --strict
      - run: uv run python scripts/validate_refresh_engine_skill.py

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv build
      - run: uv publish --dry-run --trusted-publishing never dist/*
      - run: uv run python scripts/validate_distribution.py dist
