[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[project]
name = "refresh-engine"
version = "1.0.0"
description = "Asyncio-first, domain-neutral change detection and dependency-aware refresh orchestration for Python."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "S. Muni Harish" }]
keywords = [
  "asyncio",
  "change-detection",
  "dependency-graph",
  "fingerprint",
  "incremental",
  "orchestration",
  "refresh",
  "scheduler",
  "synchronization",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "structlog>=26.1.0",
  "tenacity>=9.2.1",
]

[project.optional-dependencies]
otel = [
  "opentelemetry-api>=1.45.2,<2",
  "opentelemetry-sdk>=1.45.2,<2",
]

[project.urls]
Homepage = "https://github.com/smuniharish/refresh-engine"
Documentation = "https://refresh-engine.readthedocs.io"
Repository = "https://github.com/smuniharish/refresh-engine"
Issues = "https://github.com/smuniharish/refresh-engine/issues"
Changelog = "https://refresh-engine.readthedocs.io/en/latest/changelog/"

[dependency-groups]
test = [
  "coverage[toml]>=7.17.2",
  "hypothesis>=6.170.15",
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1.post1",
  "pytest-cov>=7.1.0",
  "pytest-timeout>=2.4.0",
  "skills-ref>=0.1.1,<1",
]
lint = ["ruff>=0.17.4"]
types = ["pyrefly>=1.4.1"]
docs = [
  "griffe-pydantic>=1.3.2,<2",
  "mkdocstrings-python>=2.0.10,<3",
  "zensical>=0.1.0,<0.2",
]
examples = [
  "psycopg[binary,pool]>=3.3.8,<4",
]
package = ["twine>=7.0.0"]
audit = ["pip-audit>=2.10.1"]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "types" },
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
xfail_strict = true
filterwarnings = ["error"]
timeout = "120"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.coverage.run]
branch = true
source_pkgs = ["refresh_engine"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "^\\s*\\.\\.\\.\\s*$",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "C4",
  "D",
  "E",
  "ERA",
  "F",
  "FURB",
  "I",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PT",
  "RET",
  "RUF",
  "S",
  "SIM",
  "T20",
  "UP",
  "W",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S311"]
"src/refresh_engine/testing.py" = ["S101"]
"examples/**" = ["D", "S101", "T201"]
"benchmarks/**" = ["D", "S311", "T201"]
"scripts/**" = ["D", "S603", "S607", "T201"]
"refresh-engine-skills/**" = ["T201"]
"tests/skill/**" = ["D", "S101", "T201"]

[tool.pyrefly]
project-includes = [
  "src",
  "tests",
  "examples",
  "scripts",
  "benchmarks",
  "refresh-engine-skills",
  "tests/skill",
]
search-path = ["src", ".", "examples", "scripts"]
python-version = "3.12"
