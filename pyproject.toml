[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "refresh-engine"
version = "0.1.0"
description = "Production-grade generic refresh infrastructure"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "S. Muni Harish" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "apscheduler>=3.11,<4",
  "networkx>=3.6,<4",
  "structlog>=25.4,<26",
  "tenacity>=9.1,<10",
]

[dependency-groups]
docs = [
  "black>=25.1",
  "mkdocs>=1.6",
  "mkdocs-material>=9.6",
  "mkdocstrings[python]>=0.28",
]
dev = [
  "coverage[toml]>=7.6",
  "hatchling>=1.27",
  "hypothesis>=6.124",
  { include-group = "docs" },
  "pyrefly>=0.35",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "psycopg[binary]>=3.2,<4",
  "pip-audit>=2.9,<3",
  "pip-system-certs>=5,<6",
  "ruff>=0.9",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/refresh_engine"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["refresh_engine"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.black]
target-version = ["py312"]
line-length = 88

[tool.pyrefly]
project-includes = ["src/**/*.py", "tests/**/*.py"]
project-excludes = ["examples/**"]
python-version = "3.12"
search-path = [".", "src"]
