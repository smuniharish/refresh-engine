site_name: refresh-engine
site_description: Domain-neutral refresh orchestration for Python
docs_dir: docs
theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_category_heading: true
            separate_signature: true
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Overview: guides/index.md
      - Sources and operations: guides/sources-and-operations.md
      - Refresh modes: guides/refresh-modes.md
      - Fingerprints and dependencies: guides/fingerprints-and-dependencies.md
      - Triggers and scheduling: guides/triggers-and-scheduling.md
      - State and failure safety: guides/state-and-failure-safety.md
      - Events and observability: guides/events-and-observability.md
      - Examples: guides/examples-and-results.md
  - API:
      - Overview: api/index.md
      - Engine: api/engine.md
      - Contracts: api/contracts.md
      - Models: api/models.md
      - Fingerprints and selectors: api/strategies.md
      - Events, stores, and scheduling: api/services.md
  - Architecture:
      - Overview: architecture/overview.md
      - Lifecycle: architecture/lifecycle.md
      - Architecture decisions: architecture/decisions.md
strict: true
