site_name: refresh-engine
site_description: >-
  Asyncio-first, domain-neutral change detection and dependency-aware refresh
  orchestration for Python.
site_author: S. Muni Harish
site_url: https://refresh-engine.readthedocs.io/en/latest/
repo_url: https://github.com/smuniharish/refresh-engine
repo_name: smuniharish/refresh-engine
edit_uri: edit/master/docs/
copyright: Copyright &copy; 2026 S. Muni Harish &middot; Apache License 2.0
docs_dir: docs
strict: true

exclude_docs: |
  *.mmd

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to system preference
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          inventories:
            - https://docs.python.org/3/objects.inv
          options:
            docstring_style: google
            docstring_options:
              ignore_init_summary: true
            filters: ["!^_"]
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_if_no_docstring: false
            show_root_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: false

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - Guides:
      - guides/index.md
      - Sources and operations: guides/sources-and-operations.md
      - Refresh modes and targeting: guides/refresh-modes.md
      - Change detection: guides/change-detection.md
      - Dependencies: guides/dependencies.md
      - Failure handling: guides/failure-handling.md
      - State stores: guides/state-stores.md
      - Scheduling and overlap: guides/scheduling.md
      - Events, logging, and metrics: guides/observability.md
      - Testing integrations: guides/testing.md
      - Performance: guides/performance.md
      - Production checklist: guides/production.md
  - Examples: examples.md
  - API reference:
      - api/index.md
      - Engine: api/engine.md
      - Models and configuration: api/models.md
      - Extension contracts: api/contracts.md
      - Fingerprints: api/fingerprints.md
      - Selectors: api/selectors.md
      - Events: api/events.md
      - Logging and metrics: api/observability.md
      - Scheduling: api/scheduling.md
      - State stores: api/stores.md
      - Exceptions: api/errors.md
  - Architecture:
      - Overview: architecture/overview.md
      - Lifecycle: architecture/lifecycle.md
  - Agent Skills: agent-skills.md
  - Changelog: changelog.md
