id: incremental-refresh
title: "Eval 2 — Incremental refresh at scale"
prompt: >
  I have 10,000 resources and only a few change between refreshes. How can I
  avoid refreshing everything every time with refresh-engine?
category: incremental-refresh
difficulty: intermediate
expected_behavior:
  - Recommends RefreshMode.INCREMENTAL (the default mode) instead of FULL.
  - Explains fingerprint-based change detection (FingerprintStrategy, default
    CompositeHash) compares a new fingerprint against the last stored
    ResourceState.fingerprint.
  - Mentions the reliable cheap_indicator / cheap_indicator_reliable pre-check
    as a way to skip snapshotting entirely for provably-unchanged resources,
    and warns it must only be used when equality proves no change occurred.
  - States that only ADDED/MODIFIED/(safely inferred) DELETED resources are
    selected for execution in INCREMENTAL mode; UNCHANGED resources are not
    re-run.
  - Points to RefreshResult counts (unchanged_count, modified_count,
    refreshed_count) as the way to verify this behavior.
red_flags:
  - Suggests RefreshMode.FULL as the solution.
  - Invents a "batch size" or "pagination" config option that does not exist
    on RefreshConfig.
  - Suggests writing custom hashing/diffing logic instead of using
    FingerprintStrategy/ChangeDetector.
  - Claims cheap_indicator_reliable is safe to set True as a default
    optimization regardless of the source's actual guarantees.
reference_material:
  - skills/refresh-engine/references/incremental-refresh.md
  - skills/refresh-engine/references/fingerprinting.md
  - skills/refresh-engine/examples/incremental.md
verification:
  - Confirm claimed behavior against examples/10_scale_and_genericity.py output
    (unchanged_count == 10000, refreshed_count == 0 on the second refresh).
  - Confirm RefreshMode.INCREMENTAL is the RefreshEngine.refresh() default.
