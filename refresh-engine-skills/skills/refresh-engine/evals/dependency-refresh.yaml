id: dependency-refresh
title: "Eval 4 — Dependency-aware refresh"
prompt: >
  Resource A depends on resource B, and B just changed. How should
  refresh-engine handle refreshing A?
category: dependency-refresh
difficulty: intermediate
expected_behavior:
  - Explains that dependencies are declared via Resource.dependencies /
    ResourceSnapshot.dependencies (frozenset of resource IDs the resource
    depends on).
  - Recommends RefreshMode.DEPENDENCY_AWARE so that a direct change to B is
    expanded, via DependencyGraph + ImpactAnalyzer, into an ImpactSet whose
    all_impacted set includes A as an indirectly_impacted dependent.
  - States the execution order — dependencies (B) run before dependents (A) —
    via the RefreshPlanner topological levels.
  - Mentions that a dependency cycle raises DependencyCycleError and must be
    fixed in the source data, not caught and ignored.
  - Distinguishes RefreshResult.modified_count (direct changes) from
    impacted_count (indirect dependents).
red_flags:
  - Suggests manually tracking "affected resources" outside the engine instead
    of using DEPENDENCY_AWARE mode / DependencyGraph.
  - Gets the dependency direction backwards (claims A's change affects B).
  - Ignores or is unaware of DependencyCycleError.
  - Invents a "cascade" or "propagate" API that doesn't exist.
reference_material:
  - skills/refresh-engine/references/dependency-refresh.md
  - skills/refresh-engine/examples/dependency-aware.md
verification:
  - >
    Confirm against examples/02_dependencies_and_fingerprints.py verified output:
    "dependency-aware: modified=1, impacted=1, refreshed=['base', 'derived']".
  - Confirm DependencyGraph.add_dependency(resource_id, dependency_id) semantics
    in src/refresh_engine/planning/dependency.py.
