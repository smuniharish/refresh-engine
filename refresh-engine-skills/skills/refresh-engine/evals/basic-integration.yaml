id: basic-integration
title: "Eval 1 — Basic integration"
prompt: >
  I need to refresh a collection of resources periodically using refresh-engine.
  How should I integrate it?
category: integration
difficulty: basic
expected_behavior:
  - Identifies that the agent must supply a ResourceSource (discover + snapshot)
    and a RefreshOperation callable, and construct a RefreshEngine with them.
  - Explains the refresh lifecycle at a high level (discover -> snapshot/fingerprint
    -> detect changes -> plan -> execute -> persist state -> events).
  - Uses only real public API symbols (RefreshEngine, DiscoveryResult, Resource,
    ResourceSnapshot, PlanAction) — verifiable against refresh_engine.__all__.
  - Recommends periodic refresh via AsyncScheduler or an external scheduler
    (ExternalSchedulerAdapter), not a blocking loop.
  - Calls await engine.close() in the shutdown path.
red_flags:
  - Invents methods/classes not in refresh_engine.__all__.
  - Suggests time.sleep() or a blocking loop for "periodic".
  - Skips implementing ResourceSource/RefreshOperation and claims the engine
    infers resource meaning automatically.
  - Never mentions closing the engine.
reference_material:
  - skills/refresh-engine/SKILL.md
  - skills/refresh-engine/references/architecture.md
  - skills/refresh-engine/references/scheduling.md
  - skills/refresh-engine/examples/basic.md
verification:
  - Cross-check every referenced symbol against `python -c "import refresh_engine; print(sorted(refresh_engine.__all__))"`.
  - Confirm the produced code executes against refresh-engine==0.1.0 without
    AttributeError/ImportError.
