id: failure-handling
title: "Eval 5 — Discovery failure safety"
prompt: >
  Discovery failed temporarily while using refresh-engine. Should I assume
  every existing resource was deleted?
category: failure-handling
difficulty: basic
expected_behavior:
  - States clearly that the answer is no. A discovery failure raises/propagates as
    DiscoveryError and aborts the refresh (RefreshStatus.FAILED); it is never
    treated as "zero resources discovered."
  - Distinguishes this from a partial discovery (DiscoveryResult(complete=False)),
    which also never infers deletion for the resource IDs it omitted — only a
    complete=True discovery may plan PlanAction.DELETE for missing IDs.
  - Explains that previously stored ResourceState for affected resources is
    left untouched in both cases.
  - Recommends surfacing the discovery error (retry, alert, or fail the
    refresh) rather than suppressing it or forcing complete=True to "unblock"
    processing.
red_flags:
  - Suggests catching the discovery exception and returning an empty resource
    list, treating it as equivalent to "resources were deleted."
  - Recommends setting complete=True unconditionally to simplify handling.
  - Claims the engine automatically retries discovery indefinitely (it does
    not, unless the caller configures TimeoutConfig/RetryConfig — note retry
    in the executor is scoped to per-resource operations, not discovery).
reference_material:
  - skills/refresh-engine/references/failure-handling.md
  - skills/refresh-engine/references/architecture.md
verification:
  - Confirm against tests/integration/test_safety.py::test_source_failure_never_infers_deletion
    and test_partial_discovery_never_infers_deletion, and
    examples/06_resilience_and_partial_discovery.py verified output
    "partial discovery deletions=0".
